name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml reuses this matrix and publishes its artifacts.
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15-intel }
          # glibc 2.28 baseline: runs on Debian 10+, Ubuntu 20.04+, RHEL 8+, Amazon Linux 2023,
          # which is also the floor Node 20+ itself requires.
          - { target: linux-x64-gnu, os: ubuntu-24.04, container: 'quay.io/pypa/manylinux_2_28_x86_64' }
          - { target: linux-arm64-gnu, os: ubuntu-24.04-arm, container: 'quay.io/pypa/manylinux_2_28_aarch64' }
          - { target: linux-x64-musl, os: ubuntu-24.04, container: 'node:24-alpine' }
          # No JS actions in Alpine containers on arm64 runners.
          - { target: linux-arm64-musl, os: ubuntu-24.04-arm, container: 'node:24-alpine', shell-only: true }
          - { target: win32-x64, os: windows-2025 }
          - { target: win32-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Install toolchain (alpine)
        if: endsWith(matrix.target, '-musl')
        # Alpine has no bash until this step installs it.
        shell: sh
        run: apk add --no-cache bash git github-cli python3 py3-pip make g++ meson ninja-build
      - name: Install toolchain (manylinux)
        if: endsWith(matrix.target, '-gnu')
        run: pipx install meson && pipx install ninja

      - uses: actions/checkout@v4
        if: ${{ !matrix.shell-only }}
        with:
          submodules: true
      - name: Checkout (shell)
        if: ${{ matrix.shell-only }}
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          git submodule update -q --init --depth 1

      - uses: actions/setup-node@v4
        if: ${{ !matrix.container || endsWith(matrix.target, '-gnu') }}
        with:
          node-version: 24
      - name: Install meson (macOS, Windows)
        if: ${{ !matrix.container }}
        run: pip install meson ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: startsWith(matrix.target, 'win32')
        with:
          arch: ${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'x64' }}

      - run: corepack enable && yarn workspaces focus thorvg-canvas
      - run: yarn build
      - run: yarn typecheck
      - run: yarn test

      - name: Show linked libraries
        if: startsWith(matrix.target, 'linux')
        run: ldd build/Release/thorvg.node || true

      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.shell-only }}
        with:
          name: prebuild-${{ matrix.target }}
          path: build/Release/thorvg.node
          if-no-files-found: error
      - name: Upload to the draft release (shell)
        if: ${{ matrix.shell-only && inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/Release/thorvg.node "prebuild-${{ matrix.target }}.node"
          gh release upload "${{ inputs.release_tag }}" "prebuild-${{ matrix.target }}.node" \
            --clobber -R "${{ github.repository }}"

  visual:
    name: visual parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pip install meson ninja
      - run: corepack enable && yarn workspaces focus thorvg-canvas
      - run: yarn build
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: yarn test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-report
          path: test/visual/output
