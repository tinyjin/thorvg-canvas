name: Release

# Push a tag matching package.json's version (e.g. `v0.1.0`) to publish.
#
# Auth is npm Trusted Publishing (OIDC): no npm token is stored anywhere. Set it
# up once on npmjs.com → package settings → Trusted Publisher:
#   repository: <owner>/thorvg-canvas, workflow: release.yml, environment: npm
# Trusted publishers can only be added to a package that already exists, so the
# very first release needs a granular NPM_TOKEN secret; delete the secret once
# the trusted publisher is configured.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME"

  build:
    needs: draft
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Gate on the `npm` environment: add required reviewers to it in the repo
    # settings so a stray tag cannot publish without approval.
    environment: npm
    permissions:
      contents: write
      id-token: write # OIDC token for npm Trusted Publishing (and provenance)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: artifacts

      - name: Collect prebuilds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in artifacts/prebuild-*; do
            target="${dir#artifacts/prebuild-}"
            mkdir -p "prebuilds/$target"
            cp "$dir/thorvg.node" "prebuilds/$target/thorvg.node"
          done
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p 'prebuild-*.node' -D release-assets
          for file in release-assets/prebuild-*.node; do
            target="$(basename "$file" .node)"
            target="${target#prebuild-}"
            mkdir -p "prebuilds/$target"
            cp "$file" "prebuilds/$target/thorvg.node"
          done

      - run: corepack enable && yarn install --immutable

      # prepack refuses to pack unless all eight prebuilds are present.
      - run: npm publish --access public
        env:
          # Only for the first release (see the top of this file); empty afterwards.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false
