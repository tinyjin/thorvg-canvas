name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

  draft:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${prerelease[@]}"

  build:
    needs: draft
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Update npm
        run: npm install -g npm@latest

      - name: Download prebuilds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuild-*
          path: artifacts

      - name: Collect prebuilds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in artifacts/prebuild-*; do
            target="${dir#artifacts/prebuild-}"
            mkdir -p "prebuilds/$target"
            cp "$dir/thorvg.node" "prebuilds/$target/thorvg.node"
          done
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p 'prebuild-*.node' -D release-assets
          for file in release-assets/prebuild-*.node; do
            target="$(basename "$file" .node)"
            target="${target#prebuild-}"
            mkdir -p "prebuilds/$target"
            cp "$file" "prebuilds/$target/thorvg.node"
          done
          cp thorvg/LICENSE prebuilds/LICENSE

      - name: Install dependencies
        run: corepack enable && yarn workspaces focus thorvg-canvas

      - name: Publish to npm
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm publish --access public --provenance --tag "$tag"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false

  docs:
    needs: publish
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
